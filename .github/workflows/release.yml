name: release

# Runs when a release is published on GitHub, or when a v* tag is pushed.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  AGAVE_VERSION: v2.3.13

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build SBF
        run: cargo-build-sbf --manifest-path programs/solml_escrow/Cargo.toml --sbf-out-dir target/deploy
      - name: Checksum
        run: cd target/deploy && sha256sum solml_escrow.so > solml_escrow.so.sha256 && cat solml_escrow.so.sha256
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          NOTES="Program ID 3bNY3MoiTTYZMCg3imcHF1UKGuNJ8M2186uSSvMd8SKV. Built with Agave ${AGAVE_VERSION}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" target/deploy/solml_escrow.so target/deploy/solml_escrow.so.sha256 --clobber
          else
            gh release create "$TAG" target/deploy/solml_escrow.so target/deploy/solml_escrow.so.sha256 --title "$TAG" --notes "$NOTES"
          fi
