<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SolML</title>
    <meta name="description" content="Write a SolML escrow contract and see the Solana account, terms and checks it compiles to." />
    <meta name="theme-color" content="#14161a" />
    <link rel="icon" href="/seal.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="bloom" aria-hidden="true"></div>
    <header class="bar glass">
      <a class="mark" href="#/" aria-label="SolML playground">
        <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#g-seal" /></svg>
        <span>SolML</span>
      </a>
      <nav aria-label="Main">
        <a href="#/" data-nav="play">Playground</a>
        <a href="#/docs/language" data-nav="docs">Docs</a>
        <a class="btn ghost" href="https://github.com/artificialiman/solml" rel="noopener">
          <span>Source</span>
          <svg class="trail" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-out" /></svg>
        </a>
      </nav>
    </header>
    <main id="view"></main>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="g-seal" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1" opacity=".55" />
        <circle cx="16" cy="13.2" r="2.6" fill="currentColor" />
        <path d="M14.6 15.2h2.8l1 6.3h-4.8z" fill="currentColor" />
      </symbol>
      <symbol id="i-out" viewBox="0 0 16 16"><path d="M6 3h7v7M13 3 4 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.5" /></symbol>
      <symbol id="i-check" viewBox="0 0 16 16"><path d="m3 8.5 3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-down" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 1.5h5l3.5 3.5v9.5h-8.5z M9 1.5V5h3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /></symbol>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
