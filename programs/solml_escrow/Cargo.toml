[package]
name = "solml_escrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "SolML v1 escrow program: one audited program, contracts as data"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "solml_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
